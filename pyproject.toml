[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "options-income-copilot"
version = "0.0.1"
description = "Educational agentic-AI capstone: a human-approved, rules-based options-income copilot (no live trading)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "chromadb>=1.0",
    "yfinance>=0.2.40",
    # Phase 5 multi-agent layer. Pinned: CrewAI needs mcp<2 and pydantic<2.13.
    "langgraph==1.2.17",
    "crewai==1.15.30",
    "mcp==1.30.0",
    "pydantic>=2.11.9,<2.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pre-commit>=3.7"]

[project.scripts]
copilot = "options_copilot.cli:main"

[tool.setuptools]
packages = ["options_copilot"]

[tool.setuptools.package-data]
options_copilot = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not llm and not network'"
filterwarnings = [
    # CrewAI warns about its own internal use of deprecated fields; nothing in our code triggers it
    "ignore::DeprecationWarning:crewai.*",
]
markers = [
    "llm: needs a running Ollama model (skipped by default; run with -m llm)",
    "network: needs internet access (skipped by default; run with -m network)",
]
