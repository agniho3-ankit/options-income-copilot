# Install once: pre-commit install   (then these run on every commit)
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: privacy-audit
        name: privacy audit (PII, home paths, keys, denylist)
        entry: python3 scripts/privacy_audit.py
        language: system
        pass_filenames: true
